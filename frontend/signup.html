<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign up - SkillMatch AI</title>
  <link rel="stylesheet" href="css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="logo" style="margin-bottom:24px;">Skill<span style="color:var(--accent-2)">Match</span> AI</div>
      <h2>Create your account</h2>
      <p class="sub">Join as a candidate or a recruiter.</p>

      <div id="form-msg" class="form-msg"></div>

      <!-- id="signup-form" is what auth.js listens for -->
      <form id="signup-form">
        <div class="field">
          <label for="full_name">Full name</label>
          <input type="text" id="full_name" name="full_name" required />
        </div>
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" required autocomplete="username" />
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="email" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required autocomplete="new-password" />
        </div>
        <div class="field">
          <label for="role">I am a...</label>
          <select id="role" name="role">
            <option value="candidate">Candidate (looking for a job)</option>
            <option value="recruiter">Recruiter (posting jobs)</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Create account</button>
      </form>

      <div class="switch-link">Already have an account? <a href="login.html">Log in</a></div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
