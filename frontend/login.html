<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in - SkillMatch AI</title>
  <link rel="stylesheet" href="css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="logo" style="margin-bottom:24px;">Skill<span style="color:var(--accent-2)">Match</span> AI</div>
      <h2>Welcome back</h2>
      <p class="sub">Log in to check your resume matches.</p>

      <!-- shown/hidden dynamically by auth.js -->
      <div id="form-msg" class="form-msg"></div>

      <!-- id="login-form" is what auth.js listens for -->
      <form id="login-form">
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" required autocomplete="username" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Log in</button>
      </form>

      <div class="switch-link">Don't have an account? <a href="signup.html">Sign up</a></div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
